<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core" >
    <h:head>
        <title>Select Topic</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link rel="stylesheet" href="styles.css"/>
    </h:head>
    <h:body styleClass="survey-body">
       <div class="container py-4 py-lg-5">
           <div class="row justify-content-center">
               <div class="col-12 col-lg-8 col-xl-6">
                   <div class="card border-0 shadow-lg overflow-hidden">
                       <div class="card-header survey-hero text-white py-4">
                           <div class="survey-brand">Survey</div>
                           <p class="mb-0 text-white-50">Choose a topic and start the questionnaire.</p>
                       </div>
                       <div class="card-body p-4 p-lg-5">
                           <h2 class="h3 mb-3">Select Topic</h2>
                           <h:form id="selectTopicForm">
                               <div class="mb-3">
                                   <label class="form-label fw-semibold" for="topic">Available Topics</label>
                                   <h:selectOneMenu id="topic" value="#{topic.id}" styleClass="form-select">
                                       <f:selectItems value="#{topic.topics}" />
                                   </h:selectOneMenu>
                               </div>
                               <h:commandButton action="#{topic.process}" value="Start Survey" styleClass="btn btn-primary"/>
                           </h:form>
                           <div class="mt-3">
                               <a href="wellness-start.xhtml" class="btn btn-success w-100">Open Workplace Wellness Survey</a>
                           </div>
                           <div class="mt-2">
                               <a href="wellness-results.xhtml" class="btn btn-outline-primary w-100">View Workplace Wellness Results</a>
                           </div>
                           <p class="small text-muted mt-4 mb-4">Click Start Survey to begin participating.</p>
                           <div class="text-center">
                               <img src="topic.jpg" class="img-fluid rounded-4 shadow-sm" alt="Survey topic"/>
                           </div>
                       </div>
                   </div>
               </div>
           </div>
       </div>
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </h:body>
</html>
