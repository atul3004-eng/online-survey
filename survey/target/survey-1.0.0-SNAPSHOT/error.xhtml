<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html">
    <h:head>
        <title>Error Page</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link rel="stylesheet" href="styles.css"/>
    </h:head>
    <h:body styleClass="survey-body">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-7 col-xl-5">
                    <div class="card border-0 shadow-lg overflow-hidden">
                        <div class="card-header survey-hero text-white py-4">
                            <div class="survey-brand">Survey</div>
                        </div>
                        <div class="card-body p-4 p-lg-5 text-center">
                            <h2 class="h3 mb-3 text-danger">Something went wrong.</h2>
                            <p class="text-muted mb-4">We could not process your survey results this time. Please try again.</p>
                            <a href="index.xhtml" class="btn btn-outline-primary">Back to Topic Selection</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </h:body>
</html>
