<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>#{appInfoBean.appTitle}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body styleClass="admin-body">
    <div class="container py-4 py-lg-5">
        <header class="card border-0 shadow-sm overflow-hidden hero-card">
            <div class="card-body p-4 p-lg-5 hero-surface">
                <div class="d-flex flex-column flex-lg-row justify-content-between gap-4 align-items-lg-start">
                    <div>
                        <p class="text-uppercase small fw-semibold mb-2 text-white-50">JSF 2.2 + PrimeFaces 12 + Bootstrap 5</p>
                        <h1 class="display-5 fw-bold text-white mb-3">#{appInfoBean.appTitle}</h1>
                        <p class="lead mb-0 text-white-50">Manage survey topics, questions, and live response summaries from one Bootstrap-powered admin console.</p>
                    </div>
                    <h:panelGroup layout="block" rendered="#{authBean.loggedIn}" styleClass="d-flex flex-column flex-sm-row align-items-sm-center gap-2">
                        <span class="badge rounded-pill text-bg-light px-3 py-2">#{authBean.loggedInUser}</span>
                        <h:outputLink value="#{request.contextPath}/logout" styleClass="btn btn-light btn-sm">Logout</h:outputLink>
                    </h:panelGroup>
                </div>
            </div>
        </header>

        <h:panelGroup layout="block" styleClass="mt-4" rendered="#{authBean.loggedIn}">
            <div class="nav nav-pills gap-2">
                <h:link outcome="/topics.xhtml" value="Topics" styleClass="nav-link active"/>
            </div>
        </h:panelGroup>

        <div class="mt-4">
            <p:messages id="messages" showDetail="true" closable="true"/>
        </div>
        <ui:insert name="content"/>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
