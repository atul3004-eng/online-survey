<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<ui:composition template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="content">
        <section class="row justify-content-center mt-4">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">
                        <div class="mb-4">
                            <h2 class="h3 mb-2">Admin Login</h2>
                            <p class="text-muted mb-0">Use the seeded admin account or your existing user record.</p>
                        </div>
                        <h:panelGroup layout="block" styleClass="alert alert-danger" rendered="#{not empty param.error}">
                            Invalid username or password.
                        </h:panelGroup>
                        <h:panelGroup layout="block" styleClass="alert alert-success" rendered="#{not empty param.logout}">
                            You have been signed out.
                        </h:panelGroup>
                        <form id="loginForm" method="post" action="#{request.contextPath}/login">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input id="username" name="username" type="text" required="required" class="form-control"/>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input id="password" name="password" type="password" required="required" class="form-control"/>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Sign In</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </ui:define>
</ui:composition>
</html>
