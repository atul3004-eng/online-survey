<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/WEB-INF/templates/admin.xhtml">
    <ui:define name="content">
        <section class="row mt-1" rendered="#{not empty surveyResultBean.topic}">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="mb-4">
                            <h2 class="h4 mb-2">Survey Results</h2>
                            <p class="text-muted mb-0">Response percentages for "#{surveyResultBean.topic.title}".</p>
                        </div>
                        <h:form>
                            <p:dataTable value="#{surveyResultBean.results}" var="result" emptyMessage="No survey submissions found yet.">
                                <p:column headerText="Question">
                                    <h:outputText value="#{result.question}"/>
                                </p:column>
                                <p:column headerText="Option 1">
                                    <h:outputText value="#{result.option1} (#{result.option1Percent}%)"/>
                                </p:column>
                                <p:column headerText="Option 2">
                                    <h:outputText value="#{result.option2} (#{result.option2Percent}%)"/>
                                </p:column>
                                <p:column headerText="Option 3">
                                    <h:outputText value="#{result.option3} (#{result.option3Percent}%)"/>
                                </p:column>
                            </p:dataTable>
                            <div class="mt-3">
                                <h:link outcome="/topics.xhtml" value="Back to Topics" styleClass="btn btn-outline-secondary"/>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </section>

        <section class="row justify-content-center mt-4" rendered="#{empty surveyResultBean.topic}">
            <div class="col-12 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-2">Topic required</h2>
                        <p class="text-muted mb-3">Open results from the topic list to view the analytics for a specific survey topic.</p>
                        <h:link outcome="/topics.xhtml" value="Return to Topics" styleClass="btn btn-outline-secondary"/>
                    </div>
                </div>
            </div>
        </section>
    </ui:define>
</ui:composition>
</html>
