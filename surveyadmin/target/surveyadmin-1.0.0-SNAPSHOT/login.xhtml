<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<ui:composition template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="content">
        <section class="row justify-content-center mt-4">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">
                        <div class="mb-4">
                            <h2 class="h3 mb-2">Admin Login</h2>
                            <p class="text-muted mb-0">Use the seeded admin account or your existing user record.</p>
                        </div>
                        <h:form id="loginForm">
                            <div class="mb-3">
                                <p:outputLabel for="username" value="Username" styleClass="form-label fw-semibold"/>
                                <p:inputText id="username" value="#{authBean.username}" required="true" requiredMessage="Username is required." styleClass="w-100"/>
                            </div>
                            <div class="mb-4">
                                <p:outputLabel for="password" value="Password" styleClass="form-label fw-semibold"/>
                                <p:password id="password" value="#{authBean.password}" feedback="false" required="true" requiredMessage="Password is required." styleClass="w-100"/>
                            </div>
                            <p:commandButton value="Sign In" action="#{authBean.login}" ajax="false" styleClass="w-100"/>
                        </h:form>
                    </div>
                </div>
            </div>
        </section>
    </ui:define>
</ui:composition>
</html>
